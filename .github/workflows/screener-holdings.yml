name: Sponsorship Screener (holdings refresh)

# 13F and N-PORT holdings only change quarterly. This checks weekly for new SEC data sets
# and only does real work when one has been published.
on:
  schedule:
    - cron: '0 6 * * 0'     # Sundays 06:00 UTC
  workflow_dispatch:

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/screener/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/screener/requirements.txt

      - name: Restore large intermediates
        uses: actions/cache/restore@v4
        with:
          path: _screener_hist
          key: screener-hist-${{ github.run_id }}
          restore-keys: screener-hist-

      - name: Refresh 13F / N-PORT caches
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python -m scripts.screener.refresh_holdings

      - name: Save large intermediates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: _screener_hist
          key: screener-hist-${{ github.run_id }}

      - name: Rebuild screener.json
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m scripts.screener.build

      - name: Commit and push
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _screener_cache trading/screener/screener.json
          git commit -m "Refresh institutional holdings cache 🏛️" || { echo "No changes"; exit 0; }
          git pull --rebase --autostash
          git push
