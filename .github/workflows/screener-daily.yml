name: Sponsorship Screener (daily)

on:
  schedule:
    # 22:30 UTC on weekdays, after the US close
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # "Re-run" must still use the latest code, not the original commit

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/screener/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/screener/requirements.txt

      - name: Unit tests
        run: python -m pytest scripts/screener/tests -q

      - name: Restore SEC XBRL frames cache
        uses: actions/cache@v4
        with:
          path: _screener_hist/frames
          key: screener-frames-${{ github.run_id }}
          restore-keys: screener-frames-

      - name: Build screener.json
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python -m scripts.screener.build

      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trading/screener/screener.json _screener_cache/info.json
          git commit -m "Update sponsorship screener 🏛️" || { echo "No changes"; exit 0; }
          for i in 1 2 3; do
            git fetch origin main
            # generated files: on conflict keep this run's freshly built copy
            if git rebase -X theirs origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
